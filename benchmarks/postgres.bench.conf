# Postgres tuning for the THROWAWAY benchmark database only.
#
# fsync/synchronous_commit are off so disk durability never masks the CPU /
# connection costs we are trying to measure. This is safe here and ONLY here:
# the bench DB is disposable. Do not reuse this file for any database whose
# data you care about.
listen_addresses = '*'

# Headroom for the connection-budget + churn tiers, which deliberately push
# past the default cap of 50 tenant connections. peak ≈ maxTenantConnections ×
# poolMax, so the cap=100 churn sweep (× tenant poolMax 2, + central/backoffice/
# replica) must stay comfortably under this.
max_connections = 300

shared_buffers = 256MB
work_mem = 16MB
effective_cache_size = 1GB

# Durability traded for throughput (throwaway DB).
fsync = off
synchronous_commit = off
full_page_writes = off

# Keep the planner honest for the catalog-bloat tier.
default_statistics_target = 100
