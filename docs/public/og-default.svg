<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF7F4"/>
      <stop offset="100%" stop-color="#F2E6DA"/>
    </linearGradient>
    <pattern id="tile" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#C26A4B" stroke-width="1.2" opacity="0.10">
        <path d="M60 5 L75 45 L115 45 L82 70 L95 110 L60 85 L25 110 L38 70 L5 45 L45 45 Z"/>
        <circle cx="60" cy="60" r="22"/>
