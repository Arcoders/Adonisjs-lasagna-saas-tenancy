  <!-- Footer band -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#C26A4B" stroke-width="1.5" opacity="0.4"/>

  <text x="80" y="580" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#6E6358">
