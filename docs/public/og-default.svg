    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#tile)"/>

  <!-- Logo mark -->
  <g transform="translate(80 80)">
    <g fill="none" stroke="#C26A4B" stroke-width="3">
      <path d="M40 5 L50 30 L77 30 L55 47 L63 75 L40 58 L17 75 L25 47 L3 30 L30 30 Z"/>
      <circle cx="40" cy="40" r="14"/>
    </g>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="240" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" fill="#6E6358" letter-spacing="3">
