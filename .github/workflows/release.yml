name: Release

# Changesets-driven release, gated on CI (audit P2-1): this workflow fires only
# when the `CI` workflow COMPLETES for a master commit, and the job runs only on
# `conclusion == success` — so "published to npm" mechanically implies "the full
# test suite passed on that exact commit". The old `on: push` form relied on
# ci.yml merely running on the same commit, which never actually blocked a
# publish on a red suite.
#
# On each gated run:
#   - if changeset files are pending, open/update a "version packages" PR
#     (bumps versions + rewrites each package's CHANGELOG);
#   - if none are pending, run `changeset publish` to ship any package whose
#     package.json version isn't on npm yet (idempotent, core before satellites).
# The break-glass manual publisher lives in publish.yml (workflow_dispatch).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write # push the Version PR branch + git tags
  pull-requests: write # open/update the Version PR
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    # `types: [completed]` fires on failure and cancellation too; this guard is
    # the actual gate.
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      # Check out the exact commit CI validated, not the branch tip — if master
      # moved while CI ran, the tip's suite hasn't passed yet and its publish
      # will be gated by its own CI completion.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Repo .npmrc sets ignore-scripts=true for local-dev safety; CI needs
      # esbuild's postinstall so the platform binary lands on disk.
      - name: Install dependencies
        env:
          npm_config_ignore_scripts: 'false'
        run: npm install --legacy-peer-deps --include=optional

      # No separate typecheck/lint gate here: the workflow_run gate above means
      # the full CI suite already passed on this exact commit. `npm run release`
      # still builds every package with tsc before `changeset publish`, so the
      # shipped artifact is compile-checked at publish time.
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
