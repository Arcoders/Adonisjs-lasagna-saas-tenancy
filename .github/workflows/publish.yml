name: Publish Packages (manual fallback)

# Break-glass / manual publisher. Normal releases go through `release.yml`
# (Changesets): merging to master opens a Version PR, and merging that PR
# publishes. Use this workflow only to recover a partial publish or if
# `changeset publish` ever orders the packages wrong. It is idempotent and
# core-first: each package publishes only if its exact version isn't already on
# npm, so re-running it is safe.
on:
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish (core + satellites)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      # .npmrc keeps install scripts off; esbuild (tsx/vitepress) needs its
      # postinstall to place the platform binary, so rebuild only that one
      # package with scripts enabled rather than the whole token-bearing tree.
      - name: Rebuild esbuild (scoped install script)
        run: npm_config_ignore_scripts=false npm rebuild esbuild

      - name: Typecheck
        run: npm run typecheck

      # Build core first, then the satellites (admin imports sso; all import the
      # core via the workspace symlink to its build).
      - name: Build all packages
        run: npm run build:all

      - name: Publish (idempotent, dependency order)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          publish_pkg() {
            # $1 = workspace dir (use "." for the root/core package)
            local dir="$1"
            local name version tag
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # Prerelease versions (anything after a `-`) go under the `next`
            # dist-tag so they never override `latest`.
            if [[ "$version" == *-* ]]; then tag="next"; else tag="latest"; fi

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "✓ $name@$version already published — skipping"
              return 0
            fi

            echo "→ publishing $name@$version (dist-tag: $tag)"
            if [[ "$dir" == "." ]]; then
              npm publish --access public --tag "$tag"
            else
              npm publish --workspace "$name" --access public --tag "$tag"
            fi
          }

          # Core first so satellites resolve a published peer. Only the six
          # publishable workspaces belong here: `admin` and `websockets` are
          # `private: true` (npm refuses them with EPRIVATE, which under
          # `set -euo pipefail` would abort this script mid-release), and the
          # crypto satellite was removed from the repo. `check-publish-coverage.mjs`
          # asserts every non-private package appears below.
          publish_pkg "packages/core"
          publish_pkg "packages/sso"
          publish_pkg "packages/billing"
          publish_pkg "packages/backup"
          publish_pkg "packages/reporting"
          publish_pkg "packages/ai"
